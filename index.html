<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>교육 참석 서명</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; font-family: Arial, "Malgun Gothic", sans-serif; background: #f4f6f9; color: #20242a; }
    .container { max-width: 430px; margin: 0 auto; padding: 22px; background: #fff; border-radius: 14px; box-shadow: 0 5px 18px rgba(0,0,0,.09); }
    h2 { margin: 0 0 8px; text-align: center; }
    .description { margin: 0 0 20px; color: #69727d; font-size: 14px; text-align: center; line-height: 1.5; }
    .field { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: 700; }
    input, select { width: 100%; padding: 12px; border: 1px solid #cbd2da; border-radius: 7px; background: #fff; font-size: 16px; }
    input[readonly] { background: #edf1f5; color: #3f4852; font-weight: 700; }
    canvas { width: 100%; height: 160px; border: 2px solid #333; border-radius: 7px; background: #fff; touch-action: none; }
    .button-row { display: flex; gap: 10px; margin-top: 14px; }
    button { width: 100%; min-height: 48px; padding: 11px; border: 0; border-radius: 7px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .btn-red { background: #e64b4b; }
    .btn-green { background: #2f9d58; }
    .btn-yellow { background: #fee500; color: #191919; }
    .btn-blue { background: #2878d0; }
    .btn-gray { background: #66717e; }
    .btn-dark { background: #323943; }
    .btn-close { width: 90px; min-height: 38px; margin: 22px auto 0; padding: 8px; background: #7a838e; font-size: 14px; display: block; }
    .panel { padding: 14px; border: 1px solid #dce1e7; border-radius: 9px; background: #f8fafc; }
    .result { margin-top: 18px; }
    .training-title { margin: 0 0 8px; color: #185b9d; font-size: 19px; font-weight: 800; }
    .fixed-value { padding: 12px; border: 1px solid #cbd2da; border-radius: 7px; background: #edf1f5; color: #3f4852; font-size: 16px; font-weight: 700; }
    .link-box { padding: 10px; border-radius: 6px; background: #fff; border: 1px solid #d8dee6; color: #59636e; font-size: 12px; line-height: 1.5; word-break: break-all; }
    .divider { height: 1px; margin: 22px 0; background: #e1e5ea; }
    .notice { margin-top: 13px; padding: 11px; border-radius: 7px; background: #fff8df; color: #6f5710; font-size: 13px; line-height: 1.5; }
    .viewer-link { display: block; margin-top: 18px; color: #8b939c; font-size: 12px; text-align: center; text-decoration: none; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>

<main id="workerView" class="container">
  <h2>교육 참석 서명</h2>
  <p class="description">성명을 입력하고 아래 서명란에 서명해 주세요.</p>

  <div class="field">
    <label for="trainingName">교육명</label>
    <input type="text" id="trainingName" placeholder="공유받은 링크로 접속해 주세요">
  </div>
  <div class="field">
    <label>부서명</label>
    <div id="departmentDisplay" class="fixed-value">교육 링크를 확인하고 있습니다.</div>
  </div>
  <div class="field">
    <label for="employeeName">성명</label>
    <input type="text" id="employeeName" placeholder="성함 입력">
  </div>
  <div class="field">
    <label>서명</label>
    <canvas id="sigCanvas"></canvas>
  </div>
  <div class="button-row">
    <button type="button" class="btn-red" id="clearBtn">다시 쓰기</button>
    <button type="button" class="btn-green" id="submitBtn">제출하기</button>
  </div>
  <button type="button" class="btn-close" id="workerCloseBtn">종료</button>
</main>

<main id="viewerView" class="container" hidden>
  <h2>조회자 교육 관리</h2>
  <p class="description">교육 링크를 만들어 작업자 단체카톡방에 공유하세요.</p>

  <section class="panel">
    <div class="field">
      <label for="trainingDate">교육 일자</label>
      <input type="date" id="trainingDate">
    </div>
    <div class="field">
      <label for="trainingType">교육 구분</label>
      <select id="trainingType">
        <option value="">선택해 주세요</option>
        <option value="사출">사출</option>
        <option value="조립">조립</option>
      </select>
    </div>
    <button type="button" class="btn-blue" id="createLinkBtn">교육 링크 만들기</button>
  </section>

  <section id="linkResult" class="result" hidden>
    <p id="generatedTrainingName" class="training-title"></p>
    <div id="generatedLink" class="link-box"></div>
    <div class="button-row">
      <button type="button" class="btn-yellow" id="shareBtn">카카오톡 공유</button>
      <button type="button" class="btn-gray" id="copyBtn">링크 복사</button>
    </div>
    <div class="button-row">
      <button type="button" class="btn-dark" id="testBtn">서명 화면 확인</button>
    </div>

  </section>
</main>

<script>
  const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby_nToBKByiLzffBnDoLKmjbadbAHv8dCEtxOIm1YbaX3jE7QvHxk1zjIuXZin1cvAFyA/exec';

  const params = new URLSearchParams(window.location.search);
  const isViewerMode = params.get('mode') === 'viewer';
  const workerView = document.getElementById('workerView');
  const viewerView = document.getElementById('viewerView');

  if (isViewerMode) {
    workerView.hidden = true;
    viewerView.hidden = false;
    initializeViewer();
  } else {
    initializeWorker();
  }

  function initializeWorker() {
    const education = params.get('edu');
    const trainingInput = document.getElementById('trainingName');
    const departmentDisplay = document.getElementById('departmentDisplay');
    const submitButton = document.getElementById('submitBtn');
    let fixedDepartment = '';

    if (education) {
      trainingInput.value = education;
      trainingInput.readOnly = true;
    }

    if (education && education.includes('_사출조회')) {
      fixedDepartment = '글로벌제조팀_사출';
    } else if (education && education.includes('_조립조회')) {
      fixedDepartment = '글로벌제조팀_조립';
    }

    if (fixedDepartment) {
      departmentDisplay.textContent = fixedDepartment;
    } else {
      departmentDisplay.textContent = '올바른 사출/조립 교육 링크로 접속해 주세요.';
      submitButton.disabled = true;
    }

    const canvas = document.getElementById('sigCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;
    let hasSignature = false;

    function resizeCanvas() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#111';
      hasSignature = false;
    }

    function pointerPosition(event) {
      const rect = canvas.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }

    canvas.addEventListener('pointerdown', (event) => {
      drawing = true;
      hasSignature = true;
      canvas.setPointerCapture(event.pointerId);
      const point = pointerPosition(event);
      ctx.beginPath();
      ctx.moveTo(point.x, point.y);
    });
    canvas.addEventListener('pointermove', (event) => {
      if (!drawing) return;
      event.preventDefault();
      const point = pointerPosition(event);
      ctx.lineTo(point.x, point.y);
      ctx.stroke();
    });
    canvas.addEventListener('pointerup', () => { drawing = false; ctx.beginPath(); });
    canvas.addEventListener('pointercancel', () => { drawing = false; ctx.beginPath(); });

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    document.getElementById('clearBtn').addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
      hasSignature = false;
    });

    document.getElementById('submitBtn').addEventListener('click', () => {
      const training = trainingInput.value.trim();
      const name = document.getElementById('employeeName').value.trim();

      if (!training || !fixedDepartment || !name) {
        alert('올바른 교육 링크인지 확인하고 성명을 입력해 주세요.');
        return;
      }
      if (!hasSignature) {
        alert('서명란에 서명해 주세요.');
        return;
      }

      const button = submitButton;
      button.disabled = true;
      button.textContent = '전송 중...';

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({
          action: 'sign',
          trainingName: training,
          department: fixedDepartment,
          name: name,
          signature: canvas.toDataURL('image/png')
        })
      }).then(() => {
        alert(name + '님, 서명을 전송했습니다.');
        document.getElementById('employeeName').value = '';
        ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
        hasSignature = false;
      }).catch(() => {
        alert('전송하지 못했습니다. 인터넷 연결을 확인해 주세요.');
      }).finally(() => {
        button.disabled = false;
        button.textContent = '제출하기';
      });
    });

    document.getElementById('workerCloseBtn').addEventListener('click', () => {
      const training = trainingInput.value.trim();
      if (!training || !fixedDepartment) {
        alert('올바른 교육 링크로 접속해 주세요.');
        return;
      }

      const pin = prompt('조회자 비밀번호를 입력해 주세요.');
      if (pin === null) return;

      const confirmed = confirm(
        '[' + training + ']\n\n' +
        '현재까지 제출된 서명으로 교육을 종료하고\nPDF를 관리자 이메일로 발송하시겠습니까?'
      );
      if (!confirmed) return;

      const button = document.getElementById('workerCloseBtn');
      button.disabled = true;
      button.textContent = '처리 중...';

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({
          action: 'makePDF',
          trainingName: training,
          closingPin: pin
        })
      }).then(() => {
        alert('종료 요청을 전송했습니다. 잠시 후 관리자 이메일을 확인해 주세요.');
      }).catch(() => {
        alert('종료 요청을 전송하지 못했습니다. 인터넷 연결을 확인해 주세요.');
      }).finally(() => {
        button.disabled = false;
        button.textContent = '종료';
      });
    });
  }

  function initializeViewer() {
    const dateInput = document.getElementById('trainingDate');
    const today = new Date();
    const localToday = new Date(today.getTime() - today.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    dateInput.value = localToday;

    let currentTrainingName = '';
    let currentWorkerLink = '';

    function showCurrentEducation(trainingName, workerLink) {
      currentTrainingName = trainingName;
      currentWorkerLink = workerLink;
      document.getElementById('generatedTrainingName').textContent = currentTrainingName;
      document.getElementById('generatedLink').textContent = currentWorkerLink;
      document.getElementById('linkResult').hidden = false;
    }

    function makeEducationData() {
      const dateValue = dateInput.value;
      const typeValue = document.getElementById('trainingType').value;
      if (!dateValue || !typeValue) {
        alert('교육 일자와 교육 구분을 선택해 주세요.');
        return false;
      }

      const compactDate = dateValue.slice(2).replaceAll('-', '');
      currentTrainingName = compactDate + '_' + typeValue + '조회';
      const baseUrl = window.location.origin + window.location.pathname;
      currentWorkerLink = baseUrl + '?edu=' + encodeURIComponent(currentTrainingName);

      showCurrentEducation(currentTrainingName, currentWorkerLink);
      return true;
    }

    document.getElementById('createLinkBtn').addEventListener('click', makeEducationData);

    document.getElementById('shareBtn').addEventListener('click', async () => {
      if (!currentWorkerLink && !makeEducationData()) return;
      const shareData = {
        title: currentTrainingName + ' 서명',
        text: '[' + currentTrainingName + '] 아래 링크를 눌러 본인 정보와 서명을 제출해 주세요.',
        url: currentWorkerLink
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (error) {
          if (error.name !== 'AbortError') {
            await copyToClipboard(currentWorkerLink);
            alert('공유 기능을 열지 못해 링크를 복사했습니다. 카카오톡에 붙여 넣어 주세요.');
          }
        }
      } else {
        await copyToClipboard(currentWorkerLink);
        alert('링크를 복사했습니다. 카카오톡 단체방에 붙여 넣어 주세요.');
      }
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      if (!currentWorkerLink && !makeEducationData()) return;
      await copyToClipboard(currentWorkerLink);
      alert('서명 링크를 복사했습니다.');
    });

    document.getElementById('testBtn').addEventListener('click', () => {
      if (!currentWorkerLink && !makeEducationData()) return;
      window.open(currentWorkerLink, '_blank', 'noopener');
    });

  }

  async function copyToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return;
    }
    const temporary = document.createElement('textarea');
    temporary.value = text;
    temporary.style.position = 'fixed';
    temporary.style.opacity = '0';
    document.body.appendChild(temporary);
    temporary.select();
    document.execCommand('copy');
    temporary.remove();
  }
</script>
</body>
</html>
